<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="/static/styles.css" rel="stylesheet">
</head>

<body class="p-4 dark:text-white dark:bg-gray-700"></body>
<form action="/import/{{.GroupId}}" method="POST" class="grid grid-cols-2 gap-4" enctype="multipart/form-data">
    <select name="user" required
       class="px-3 py-1 text-sm border border-gray-400 w-full"  >
        {{ range .Users }}
            <option value="{{.Id}}">{{ .Name }}</option>
        {{ end }}
    </select>

    <input type="file" name="myFile" accept=".csv" required
       class="px-3 py-1 text-sm border border-gray-400 w-full"  />
    <button type="submit" class="w-full px-3 py-1 font-bold text-sm bg-green-700 text-white">Submit</button>
</form>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Import Expenses</title>
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900 p-4">
    <div class="max-w-lg w-full bg-white dark:bg-gray-800 rounded-lg shadow-lg p-8">
        <h1 class="text-2xl font-bold text-gray-800 dark:text-white mb-6 text-center">
            Import Expenses
        </h1>
        <form action="/import/{{.GroupId}}" method="POST" enctype="multipart/form-data"
              class="space-y-6">
            <div>
                <label for="user" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Select User
                </label>
                <select name="user" id="user" required
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    {{ range .Users }}
                        <option value="{{.Id}}">{{ .Name }}</option>
                    {{ end }}
                </select>
            </div>

            <div>
                <label for="myFile" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Upload CSV File
                </label>
                <input type="file" name="myFile" id="myFile" accept=".csv" required
                       class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div class="flex items-center justify-between pt-4">
                <div class="text-xs text-gray-500 dark:text-gray-400">
                    Only CSV files are accepted
                </div>
                <button type="submit"
                        class="px-6 py-2 font-semibold text-white bg-green-600 hover:bg-green-700 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition-colors">
                    Submit Import
                </button>
            </div>
        </form>
    </div>
</body>
</html>
